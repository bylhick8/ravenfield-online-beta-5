<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Ravenfield</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>  
    <script src="Build/UnityLoader.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/RavenfieldWebGLBuild.json", {onProgress: UnityProgress});
    </script>
  <style id="RF_FULLSCREEN_CSS">html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}.webgl-content{width:100%!important;height:100%!important;position:fixed!important;top:0!important;left:0!important;margin:0!important;padding:0!important;transform:none!important}#gameContainer{width:100%!important;height:100%!important}.footer{display:none!important}</style></head>
  <body>
    <div class="webgl-content">
      <div id="gameContainer" style="width: 960px; height: 600px"></div>
      <div class="footer">
        <div class="webgl-logo"></div>
        <div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
        <div class="title">Ravenfield</div>
      </div>
    </div>
  </body>
</html>
